<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="utf-8">
    <title>OpenStreet Map Card</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <!-- استدعاء مكتبة الخرائط المجانية المفتوحة -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body { margin: 0; padding: 12px; font-family: system-ui, sans-serif; background-color: #ffffff; }
        .map-card { width: 100%; max-width: 500px; background: white; border-radius: 24px; overflow: hidden; border: 1px solid #e0e0e0; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        #map { width: 100%; height: 125px; position: relative; }
        .details-container { padding: 20px 16px; direction: rtl; text-align: right; position: relative; }
        .title { font-size: 19px; font-weight: 700; color: #202124; margin: 0 0 6px 0; }
        .address-text { font-size: 14px; color: #5f6368; line-height: 1.6; margin: 0; padding-left: 35px; }
        .arrow-icon { position: absolute; left: 20px; top: 52%; transform: translateY(-50%); color: #1a73e8; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

<div class="map-card">
    <div id="map"></div>
    <div class="details-container">
        <div class="title">العنوان</div>
        <p class="address-text" id="addressLabel">اضغط على الخريطة أو حرك الدبوس لتحديد الموقع</p>
        <div class="arrow-icon">‹</div>
    </div>
</div>

<script>
    // إحداثيات افتراضية
    let defaultCoords = [15.3547, 44.2074]; 

    // إنشاء الخريطة المجانية فوراً وبدون أي توكن أو مفتاح
    const map = L.map( map , { attributionControl: false }).setView(defaultCoords, 13);

    L.tileLayer( https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png ).addTo(map);

    // إضافة الدبوس الأحمر وجعله قابلاً للسحب التام لتغيير الموقع
    const marker = L.marker(defaultCoords, { draggable: true }).addTo(map);

    function sendDataToKodular(lat, lng) {
        if (window.AppInventor) {
            window.AppInventor.setWebViewString(lat + "," + lng);
        }
    }

    // 1. التحكم عند سحب الدبوس باليد
    marker.on( dragend , function (e) {
        const position = marker.getLatLng();
        sendDataToKodular(position.lat.toFixed(6), position.lng.toFixed(6));
    });

    // 2. التحكم عند الضغط على أي نقطة في الخريطة
    map.on( click , function (e) {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;
        marker.setLatLng([lat, lng]);
        sendDataToKodular(lat.toFixed(6), lng.toFixed(6));
    });
</script>

</body>
</html>
