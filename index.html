<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الخريطة الكاملة</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e5e3df;
        }
        #map {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }
        .leaflet-control-zoom, .leaflet-control-attribution {
            display: none !important;
        }
        /* أيقونة دبوس مصغرة وأنيقة */
        .small-pin {
            background: transparent;
            border: none;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([23.8859, 45.0792], 6);
        
        const tileUrl = "https://" + "{s}.tile." + "openstreetmap.org/{z}/{x}/{y}.png";
        L.tileLayer(tileUrl).addTo(map);

        // إنشاء دبوس مصغر (22x30 بكسل بدل 25x41 الافتراضي الضخم)
        const smallPinIcon = L.divIcon({
            className: 'small-pin',
            html: `<svg width="22" height="30" viewBox="0 0 24 34" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 22 12 22s12-13 12-22c0-6.63-5.37-12-12-12zm0 16.5c-2.48 0-4.5-2.02-4.5-4.5s2.02-4.5 4.5-4.5 4.5 2.02 4.5 4.5-2.02 4.5-4.5 4.5z" fill="#e63946" stroke="#ffffff" stroke-width="1.5"/>
                   </svg>`,
            iconSize: [22, 30],
            iconAnchor: [11, 30],
            popupAnchor: [0, -28]
        });

        let currentMarker = null;

        function moveToLocation(lat, lng, zoom = 14) {
            const numLat = parseFloat(lat);
            const numLng = parseFloat(lng);
            const numZoom = parseInt(zoom) || 14;
            if (isNaN(numLat) || isNaN(numLng)) return;

            map.setView([numLat, numLng], numZoom);
            if (currentMarker) {
                currentMarker.setLatLng([numLat, numLng]);
            } else {
                currentMarker = L.marker([numLat, numLng], { icon: smallPinIcon }).addTo(map);
            }
        }

        function syncLocation() {
            // 1. القراءة من رابط الصفحة (?lat=...&lng=...) - الأضمن 100%
            const params = new URLSearchParams(window.location.search);
            if (params.has('lat') && params.has('lng')) {
                moveToLocation(params.get('lat'), params.get('lng'), params.get('zoom') || 14);
                return;
            }

            // 2. القراءة من window.name
            if (window.name && window.name.startsWith('LOC_DATA:')) {
                try {
                    const loc = JSON.parse(window.name.replace('LOC_DATA:', ''));
                    moveToLocation(loc.lat, loc.lng, loc.zoom || 14);
                    window.name = '';
                    return;
                } catch (e) {}
            }

            // 3. القراءة من localStorage
            try {
                const saved = localStorage.getItem('selected_location');
                if (saved) {
                    const loc = JSON.parse(saved);
                    moveToLocation(loc.lat, loc.lng, loc.zoom || 14);
                    localStorage.removeItem('selected_location');
                }
            } catch (e) {}
        }

        syncLocation();
        window.addEventListener('focus', syncLocation);
        window.addEventListener('pageshow', syncLocation);
        setInterval(syncLocation, 600);

        map.on('click', function(e) {
            moveToLocation(e.latlng.lat, e.latlng.lng, map.getZoom());
            const payload = JSON.stringify({
                lat: e.latlng.lat,
                lng: e.latlng.lng
            });
            if (window.AppInventor && window.AppInventor.setWebViewString) {
                window.AppInventor.setWebViewString(payload);
            }
        });

        setTimeout(function(){ map.invalidateSize(); }, 300);
        window.addEventListener('resize', function(){ map.invalidateSize(); });
    </script>
</body>
</html>
