<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الخريطة الكاملة</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e5e3df;
        }
        #map {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }
        .leaflet-control-zoom, .leaflet-control-attribution {
            display: none !important;
        }
        .leaflet-marker-icon {
            filter: hue-rotate(140deg) saturate(200%) !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([23.8859, 45.0792], 6);
        
        const tileUrl = "https://" + "{s}.tile." + "openstreetmap.org/{z}/{x}/{y}.png";
        L.tileLayer(tileUrl).addTo(map);

        let currentMarker = null;

        function moveToLocation(lat, lng, zoom = 14) {
            map.setView([lat, lng], zoom);
            if (currentMarker) {
                currentMarker.setLatLng([lat, lng]);
            } else {
                currentMarker = L.marker([lat, lng]).addTo(map);
            }
        }

        function checkSelectedLocation() {
            const saved = localStorage.getItem('selected_location');
            if (saved) {
                try {
                    const loc = JSON.parse(saved);
                    moveToLocation(loc.lat, loc.lng, loc.zoom || 14);
                    localStorage.removeItem('selected_location');
                } catch (e) {}
            }
        }

        checkSelectedLocation();
        window.addEventListener('focus', checkSelectedLocation);
        window.addEventListener('storage', checkSelectedLocation);

        map.on('click', function(e) {
            moveToLocation(e.latlng.lat, e.latlng.lng, map.getZoom());
            const payload = JSON.stringify({
                lat: e.latlng.lat,
                lng: e.latlng.lng
            });
            if (window.AppInventor && window.AppInventor.setWebViewString) {
                window.AppInventor.setWebViewString(payload);
            }
        });

        setTimeout(function(){ map.invalidateSize(); }, 300);
        window.addEventListener('resize', function(){ map.invalidateSize(); });
    </script>
</body>
</html>
