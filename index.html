<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عداد قلاب مخصص</title>
    <style>
        /* إلغاء التوسيط الرأسي من الـ body لجعل الشريط يثبت في الأعلى */
        body {
            background-color: #ffffff; /* تم تغيير خلفية الصفحة للأبيض لكي ترى الشريط بوضوح */
            margin: 0;
            padding: 0;
            font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
        }

        /* حاوية الشريط المخصصة: بارتفاع 150px فقط وعرض الشاشة بالكامل */
        .flip-countdown-banner {
            width: 100%;
            height: 150px; /* الارتفاع المطلوب للشريط */
            background-color: #0e0e0e; /* لون الشريط الأسود فقط */
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); /* ظل خفيف أسفل الشريط */
        }

        /* الحاوية الداخلية للعداد */
        .flip-countdown {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            user-select: none;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* مجموعات الوقت (البطاقات + النص الأسفل) */
        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        /* حاوية تجمع الخانات الرقمية لكل وحدة زمنية */
        .cards-wrapper {
            display: flex;
            gap: 2px;
        }

        /* تصميم بطاقة الرقم الواحد */
        .card {
            background: linear-gradient(to bottom, #282828 50%, #1e1e1e 50%);
            border-radius: 8px; 
            width: 32px; 
            height: 54px; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px; 
            font-weight: bold;
            color: #ffffff;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
        }

        /* الخط الفاصل الأفقي في منتصف البطاقة */
        .card::after {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background-color: rgba(0, 0, 0, 0.4);
        }

        /* النقطتان الفاصلتان (:) */
        .colon-separator {
            font-size: 24px;
            font-weight: bold;
            color: #555555;
            height: 54px;
            display: flex;
            align-items: center;
            margin: 0 2px;
        }

        /* الكلمات التوضيحية أسفل الأرقام */
        .label {
            font-size: 12px; 
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <!-- شريط العداد (بارتفاع 150px فقط وعرض كامل الشاشة) -->
    <div class="flip-countdown-banner">
        <div class="flip-countdown">
            
            <!-- قسم الأيام -->
            <div class="time-box">
                <div class="cards-wrapper">
                    <div class="card">1</div>
                    <div class="card">7</div>
                    <div class="card">0</div>
                </div>
                <div class="label">يوم</div>
            </div>

            <div class="colon-separator">:</div>

            <!-- قسم الساعات -->
            <div class="time-box">
                <div class="cards-wrapper">
                    <div class="card">0</div>
                    <div class="card">7</div>
                </div>
                <div class="label">ساعة</div>
            </div>

            <div class="colon-separator">:</div>

            <!-- قسم الدقائق -->
            <div class="time-box">
                <div class="cards-wrapper">
                    <div class="card">3</div>
                    <div class="card">4</div>
                </div>
                <div class="label">دقيقة</div>
            </div>

            <div class="colon-separator">:</div>

            <!-- قسم الثواني -->
            <div class="time-box">
                <div class="cards-wrapper">
                    <div class="card">8</div>
                    <div class="card">3</div>
                </div>
                <div class="label">ثانية</div>
            </div>

        </div>
    </div>

    <!-- المساحة بالأسفل هنا أصبحت فارغة وبيضاء وجاهزة لملفات موقعك الأخرى -->

</body>
</html>
