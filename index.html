<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عداد قلاب مخصص للتطبيق</title>
    <style>
        /* تهيئة الخلفية لتطابق أبعاد الحاوية تماماً في Kodular وبدون هوامش */
        html, body {
            background-color: #0e0e0e; /* لون العداد الأسود */
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* الحاوية الرئيسية للعداد */
        .flip-countdown {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px; 
            user-select: none;
            width: 100%;
            padding: 0 4px;
            box-sizing: border-box;
        }

        /* مجموعات الوقت */
        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        /* حاوية تجمع الخانات الرقمية لكل وحدة زمنية */
        .cards-wrapper {
            display: flex;
            gap: 1.5px;
        }

        /* تصميم بطاقة الرقم الواحد المتطابقة مع حجم 100px */
        .card {
            background: linear-gradient(to bottom, #282828 50%, #1e1e1e 50%);
            border-radius: 5px; 
            width: 22px; 
            height: 38px; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px; 
            font-weight: bold;
            color: #ffffff;
            position: relative;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5);
        }

        /* الخط الفاصل الأفقي في منتصف البطاقة */
        .card::after {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background-color: rgba(0, 0, 0, 0.4);
        }

        /* النقطتان الفاصلتان (:) بين المجموعات */
        .colon-separator {
            font-size: 16px;
            font-weight: bold;
            color: #555555;
            height: 38px;
            display: flex;
            align-items: center;
            margin: 0 1px;
        }

        /* الكلمات التوضيحية أسفل الأرقام */
        .label {
            font-size: 10px; 
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <div class="flip-countdown">
        
        <!-- قسم الأيام -->
        <div class="time-box">
            <div class="cards-wrapper" id="days-box">
                <div class="card">0</div>
                <div class="card">0</div>
                <div class="card">0</div>
            </div>
            <div class="label">يوم</div>
        </div>

        <div class="colon-separator">:</div>

        <!-- قسم الساعات -->
        <div class="time-box">
            <div class="cards-wrapper" id="hours-box">
                <div class="card">0</div>
                <div class="card">0</div>
            </div>
            <div class="label">ساعة</div>
        </div>

        <div class="colon-separator">:</div>

        <!-- قسم الدقائق -->
        <div class="time-box">
            <div class="cards-wrapper" id="minutes-box">
                <div class="card">0</div>
                <div class="card">0</div>
            </div>
            <div class="label">دقيقة</div>
        </div>

        <div class="colon-separator">:</div>

        <!-- قسم الثواني -->
        <div class="time-box">
            <div class="cards-wrapper" id="seconds-box">
                <div class="card">0</div>
                <div class="card">0</div>
            </div>
            <div class="label">ثانية</div>
        </div>

    </div>

    <script>
        // قم بتعيين تاريخ ووقت انتهاء العداد التنازلي هنا (السنة، الشهر "يبدأ من 0"، اليوم، الساعة، الدقيقة، الثانية)
        // حالياً تم ضبطه بشكل افتراضي لينتهي بعد 170 يوماً من تاريخ اليوم ليتطابق مع واجهتك الحالية
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 170); 

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference < 0) {
                document.querySelector( .flip-countdown ).innerHTML = "<div style= color:#ffffff; font-size:16px; font-weight:bold; >انتهى الوقت!</div>";
                clearInterval(intervalId);
                return;
            }

            // حسابات الوقت
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // تحويل الأرقام إلى نصوص وتنسيق الخانات (أيام بـ 3 خانات والبقية بخانتين)
            const daysStr = String(days).padStart(3,  0 );
            const hoursStr = String(hours).padStart(2,  0 );
            const minutesStr = String(minutes).padStart(2,  0 );
            const secondsStr = String(seconds).padStart(2,  0 );

            // دالة لتحديث الكروت داخل حاوية معينة
            function updateBoxCards(elementId, timeString) {
                const container = document.getElementById(elementId);
                let cardsHtml =   ;
                for (let char of timeString) {
                    cardsHtml += `<div class="card">${char}</div>`;
                }
                container.innerHTML = cardsHtml;
            }

            // تحديث الواجهة لكل وحدة زمنية
            updateBoxCards( days-box , daysStr);
            updateBoxCards( hours-box , hoursStr);
            updateBoxCards( minutes-box , minutesStr);
            updateBoxCards( seconds-box , secondsStr);
        }

        // تشغيل العداد وتحديثه في نفس اللحظة وتكراره كل ثانية
        updateCountdown();
        const intervalId = setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
