<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="utf-8">
    <title>Google Styled Map Card</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://mapbox.com" rel="stylesheet">
    <script src="https://mapbox.com"></script>
    <style>
        body { 
            margin: 0; 
            padding: 12px; 
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #ffffff;
        }
        /* تصميم الكارد الدائري المطابق تماماً للصورة المعروضة */
        .map-card {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 24px; /* حواف دائرية ناعمة ومطابقة للطلب */
            overflow: hidden;
            border: 1px solid #e0e0e0;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        /* نافذة الخريطة المخصصة بالخلفية المطلوبة */
        #map { 
            width: 100%; 
            height: 125px; 
            position: relative;
            background-image: url( https://squarespace-cdn.com );
            background-size: cover;
            background-position: center;
        }
        /* تفاصيل العنوان أسفل الخريطة المصغرة */
        .details-container {
            padding: 20px 16px;
            direction: rtl;
            text-align: right;
            position: relative;
        }
        .title {
            font-size: 19px;
            font-weight: 700;
            color: #202124;
            margin: 0 0 6px 0;
        }
        .address-text {
            font-size: 14px;
            color: #5f6368;
            line-height: 1.6;
            margin: 0;
            padding-left: 35px;
            font-weight: 400;
        }
        /* السهم الجانبي المخصص للتنقل */
        .arrow-icon {
            position: absolute;
            left: 20px;
            top: 52%;
            transform: translateY(-50%);
            color: #1a73e8;
            font-size: 24px;
            font-weight: 300;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="map-card">
    <!-- حيز الخريطة المدمجة -->
    <div id="map"></div>
    
    <!-- حيز نصوص العناوين المستلمة -->
    <div class="details-container">
        <div class="title">العنوان</div>
        <p class="address-text" id="addressLabel">حي الزهراء، 2877، شارع 148، MCNA6263، 6263، الزهراء الوسطى، مكة المكرمة</p>
        <div class="arrow-icon">‹</div>
    </div>
</div>

<script>
    // تفعيل مفتاح Mapbox لضمان عمل محرك التحكم بالدبوس والسحب
    mapboxgl.accessToken =  pk.eyJ1Ijoic2EzMTMzNDUiLCJhIjoiY21zOWRneTllMDk3YzJ5cXpsYzg0c2lsbyJ9.my3-razBHXcjL7Ee1QF0tA ;
    
    // إحداثيات مكة المكرمة الافتراضية المطابقة للصورة
    let currentCoords = [39.8262, 21.4225]; 

    const map = new mapboxgl.Map({
        container:  map ,
        style:  mapbox://styles/mapbox/streets-v12 , 
        center: currentCoords, 
        zoom: 15,
        attributionControl: false
    });

    // إضافة الدبوس الأحمر الشهير وجعله قابلاً للسحب التام (Draggable) لتغيير الموقع
    const marker = new mapboxgl.Marker({ color:  #ea4335 , draggable: true })
        .setLngLat(currentCoords)
        .addTo(map);

    // إرسال الإحداثيات الجديدة مباشرة إلى Kodular لتخزينها
    function sendDataToKodular(lng, lat) {
        if (window.AppInventor) {
            window.AppInventor.setWebViewString(lat + "," + lng);
        }
    }

    // 1. التحكم عند سحب الدبوس باليد
    marker.on( dragend , () => {
        const lngLat = marker.getLngLat();
        sendDataToKodular(lngLat.lng.toFixed(6), lngLat.lat.toFixed(6));
    });

    // 2. التحكم عند الضغط على أي نقطة في مساحة الكارد لتغيير الموقع فوراً
    map.on( click , (e) => {
        const lng = e.lngLat.lng;
        const lat = e.lngLat.lat;
        marker.setLngLat([lng, lat]);
        sendDataToKodular(lng.toFixed(6), lat.toFixed(6));
    });

    // 3. دالة مخصصة لاستقبال العنوان الجديد من داخل كتل Kodular وتحديث النص تلقائياً
    function updateAddressFromApp(newAddress) {
        if(newAddress) {
            document.getElementById( addressLabel ).innerText = newAddress;
        }
    }
</script>

</body>
</html>
