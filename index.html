<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح كود الرصيد</title>
    <!-- استدعاء المكتبة الكاملة والصحيحة لقراءة الـ QR -->
    qrcode
    <style>
        body {
            font-family:  Segoe UI , Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { color: #4CAF50; margin-bottom: 20px; }
        #reader {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #333 !important;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ffeb3b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ماسح الأكواد الذكي</h2>
    <div id="reader"></div>
    <div id="result">في انتظار مسح الكود...</div>
</div>

<script>
    function onScanSuccess(decodedText, decodedResult) {
        // عرض النص المقروء في الواجهة فوراً عند النجاح
        document.getElementById( result ).innerText = "تم المسح بنجاح!";
        
        // إرسال البيانات الممسوحة مباشرة إلى تطبيق Kodular عبر الـ WebView
        if (window.AppInventoWeb || window.KodularWeb) {
            if(window.AppInventoWeb) {
                window.AppInventoWeb.setWebViewString(decodedText);
            } else if (window.KodularWeb) {
                window.KodularWeb.setWebViewString(decodedText);
            }
        } else {
            // حل احتياطي للمتصفحات العادية
            window.location.hash = decodedText;
        }
    }

    function onScanFailure(error) {
        // نتركها فارغة لتفادي إرسال أخطاء مستمرة أثناء تحرك الكاميرا بحثاً عن الكود
    }

    // إعداد وتشغيل الماسح تلقائياً
    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
</script>

</body>
</html>
