<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة كروت الشحن الآمنة</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 {
            color: #1a1a1a;
            margin-bottom: 20px;
            font-size: 21px;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-weight: bold;
            font-size: 14px;
        }
        .row-input {
            display: flex;
            gap: 8px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
            direction: ltr;
        }
        input:focus {
            border-color: #2563eb;
            outline: none;
        }
        .btn-gen {
            background-color: #374151;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }
        .btn-submit {
            background-color: #16a34a;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-submit:disabled {
            background-color: #86efac;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 15px;
            line-height: 1.6;
        }
        .success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .btn-copy {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
        }
        .change-id {
            margin-top: 15px;
            font-size: 12px;
            color: #6b7280;
            text-decoration: underline;
            cursor: pointer;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="card-box">
    <h2>إضافة كرت شحن محمي</h2>
    
    <div class="input-group">
        <label>رقم الكرت (Code):</label>
        <div class="row-input">
            <input type="text" id="cardCode" placeholder="اكتب رقم الكرت هنا">
            <button type="button" class="btn-gen" onclick="generateNumericCode()">توليد رقم</button>
        </div>
    </div>

    <div class="input-group">
        <label>المبلغ / النقاط (Value):</label>
        <input type="number" id="cardValue" placeholder="مثال: 100" min="1">
    </div>

    <button class="btn-submit" id="saveBtn" onclick="verifyAndSaveCard()">فحص وحفظ الكرت</button>

    <div id="resultBox" class="result-box"></div>
    
    <div>
        <span class="change-id" onclick="resetTableId()">تغيير رقم الجدول (Table ID)</span>
    </div>
</div>

<script>
    const API_TOKEN = "F2YsIpIM14CyzaadWxaz5QIBxChhTCOW";

    // دالة للحصول على رقم الجدول أو طلبه مرة واحدة فقط
    function getTableId() {
        let tableId = localStorage.getItem("baserow_cards_table_id");
        if (!tableId) {
            tableId = prompt("أدخل رقم جدول الكروت (Table ID) من Baserow (سيتم حفظه في جوالك ولن يُطلب مرة أخرى):");
            if (tableId && tableId.trim() !== "") {
                localStorage.setItem("baserow_cards_table_id", tableId.trim());
            }
        }
        return tableId ? tableId.trim() : null;
    }

    function resetTableId() {
        localStorage.removeItem("baserow_cards_table_id");
        getTableId();
    }

    // توليد رقم عشوائي آمن من 10 أرقام عند الضغط على الزر
    function generateNumericCode() {
        const numbers = "0123456789";
        const array = new Uint32Array(10);
        window.crypto.getRandomValues(array);
        
        let code = "";
        for (let i = 0; i < 10; i++) {
            if (i === 0) {
                code += (array[i] % 9) + 1;
            } else {
                code += numbers[array[i] % numbers.length];
            }
        }
        document.getElementById("cardCode").value = code;
    }

    // فحص عدم التكرار وحفظ الكرت في Baserow
    async function verifyAndSaveCard() {
        const tableId = getTableId();
        if (!tableId) {
            showResult("يجب إدخال رقم جدول الكروت (Table ID) أولاً لكي يعمل الحفظ!", "error");
            return;
        }

        const code = document.getElementById("cardCode").value.trim();
        const value = document.getElementById("cardValue").value.trim();
        const saveBtn = document.getElementById("saveBtn");

        if (!code || !value || Number(value) <= 0) {
            showResult("يرجى إدخال رقم الكرت والمبلغ بشكل صحيح!", "error");
            return;
        }

        saveBtn.disabled = true;
        saveBtn.innerText = "جاري فحص عدم التكرار...";

        try {
            // 1. فحص هل الكرت موجود مسبقاً لمنع التكرار
            const checkUrl = `https://baserow.io{tableId}/?user_field_names=true&filter__Code__equal=${encodeURIComponent(code)}`;
            const checkResponse = await fetch(checkUrl, {
                method: "GET",
                headers: {
                    "Authorization": `Token ${API_TOKEN}`
                }
            });

            if (!checkResponse.ok) {
                throw new Error("رقم الجدول (Table ID) غير صحيح، اضغط على 'تغيير رقم الجدول' بالأسفل لتصحيحه.");
            }

            const checkData = await checkResponse.json();

            if (checkData.results && checkData.results.length > 0) {
                showResult(`⚠️ مرفوض: رقم الكرت (<b>${code}</b>) موجود مسبقاً! أدخل رقماً آخر.`, "error");
                saveBtn.disabled = false;
                saveBtn.innerText = "فحص وحفظ الكرت";
                return;
            }

            // 2. حفظ الكرت الجديد في Baserow
            saveBtn.innerText = "جاري حفظ الكرت...";
            const saveUrl = `https://baserow.io{tableId}/?user_field_names=true`;
            const saveResponse = await fetch(saveUrl, {
                method: "POST",
                headers: {
                    "Authorization": `Token ${API_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "Code": code,
                    "Value": Number(value),
                    "Status": "new"
                })
            });

            if (saveResponse.ok) {
                showResult(
                    `✅ تم حفظ الكرت وتفعيله بنجاح!<br>` +
                    `رقم الكرت: <b>${code}</b><br>` +
                    `القيمة: <b>${value} نقطة</b><br>` +
                    `<button class="btn-copy" onclick="copyText('${code}')">نسخ الرقم لإرساله للمستخدم</button>`, 
                    "success"
                );
                document.getElementById("cardCode").value = "";
                document.getElementById("cardValue").value = "";
            } else {
                const errData = await saveResponse.json();
                showResult("حدث خطأ أثناء الحفظ: " + JSON.stringify(errData), "error");
            }

        } catch (error) {
            showResult(error.message, "error");
        }

        saveBtn.disabled = false;
        saveBtn.innerText = "فحص وحفظ الكرت";
    }

    function showResult(message, type) {
        const resultBox = document.getElementById("resultBox");
        resultBox.innerHTML = message;
        resultBox.className = "result-box " + type;
        resultBox.style.display = "block";
    }

    function copyText(text) {
        navigator.clipboard.writeText(text);
        alert("تم نسخ رقم الكرت: " + text);
    }
</script>

</body>
</html>
